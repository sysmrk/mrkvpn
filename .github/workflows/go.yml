name: Go quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - name: Formatting
        run: |
          unformatted="$(gofmt -l core cmd internal)"
          if [ -n "$unformatted" ]; then
            gofmt -d core cmd internal
            exit 1
          fi
      - name: Unit tests and race detector
        run: go test -race ./...
      - name: Static checks
        run: go vet ./...
